<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LinkedIn Content Studio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">LinkedIn Content Studio</a>
      <span class="tagline">Research → write → design → review → publish</span>
    </header>
    <main class="page">{% block content %}{% endblock %}</main>
  </body>
</html>
